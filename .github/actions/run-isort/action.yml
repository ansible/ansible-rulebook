name: run-isort
description: run isort

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"

    - name: Install dependencies
      shell: bash
      run: python -m pip install isort

    - name: Lint with isort
      shell: bash
      run: isort . --check --diff
