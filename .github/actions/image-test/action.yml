name: build-and-test-image
description: Build and test the container image

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.11

    - name: Get package version
      shell: bash
      run: |
        python -m pip install setuptools_scm
        echo "SETUPTOOLS_SCM_PRETEND_VERSION=$(python -m setuptools_scm)" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build container image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64
        tags: localhost/ansible-rulebook:test
        load: true
        build-args: |
          SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.SETUPTOOLS_SCM_PRETEND_VERSION }}

    - name: Run tests
      shell: bash
      run: >
        docker run --rm -v $PWD:/app/rulebook localhost/ansible-rulebook:test bash -c '
        cd /app/rulebook &&
        export PATH=/app/.local/bin:$PATH &&
        pip3 install -r requirements_test.txt &&
        pytest -m "e2e" -n auto'
